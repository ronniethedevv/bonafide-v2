name: CI

on:
  push:
    branches: [main, "ccr-**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Throwaway Postgres for the account/registry and migration tests (TEST_DATABASE_URL).
    # Local-only credentials for a disposable container, not a secret.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mmr
          POSTGRES_PASSWORD: mmr
          POSTGRES_DB: mmr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mmr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # @mmr/dapp is excluded from CI: it imports the compiled contract module
      # (@mmr/contracts/epoch_proof), a gitignored `compact compile` artifact that
      # isn't present in CI (no Compact toolchain, like the skipped contract KATs).
      # It is typechecked + run on the laptop against Midnight Preview, where the
      # generated module exists.
      - name: Typecheck
        run: pnpm -r --filter='!@mmr/dapp' typecheck

      - name: Test
        run: pnpm -r --filter='!@mmr/dapp' test
        env:
          TEST_DATABASE_URL: postgresql://mmr:mmr@localhost:5432/mmr

      - name: Build web
        run: pnpm --filter web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
