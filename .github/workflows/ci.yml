name: CI

on:
  push:
    branches: [main, "ccr-**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Throwaway Postgres for the account/registry and migration tests (TEST_DATABASE_URL).
    # Local-only credentials for a disposable container, not a secret.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mmr
          POSTGRES_PASSWORD: mmr
          POSTGRES_DB: mmr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mmr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Compact compiler (toolchain 0.36.1, ledger 9), pinned by checksum, so every
      # contract KAT runs against the compiled circuits.
      - name: Install Compact compiler
        run: |
          curl -sSfL -o "$RUNNER_TEMP/compactc.zip" \
            https://github.com/midnightntwrk/compact/releases/download/compactc-v0.36.1/compactc_v0.36.1_x86_64-unknown-linux-musl.zip
          echo "9d5fedfec9ae775a1e47d5c6f785130b314c1c5c52cd1a4eb9fc56d1fc61d23a  $RUNNER_TEMP/compactc.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/compactc.zip" -d "$RUNNER_TEMP/compactc"
          chmod +x "$RUNNER_TEMP"/compactc/*
          echo "$RUNNER_TEMP/compactc" >> "$GITHUB_PATH"

      - name: Compile the contract
        working-directory: packages/contracts
        run: compactc --skip-zk src/epoch_proof.compact build/epoch_proof

      # @mmr/dapp (deploy + live calls) is checked separately until it moves to
      # Midnight.js 5 for ledger 9.
      - name: Typecheck
        run: pnpm -r --filter='!@mmr/dapp' typecheck

      - name: Test
        run: pnpm -r --filter='!@mmr/dapp' test
        env:
          TEST_DATABASE_URL: postgresql://mmr:mmr@localhost:5432/mmr
          KAT_REQUIRE_BUILD: "1"

      - name: Build web
        run: pnpm --filter web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
