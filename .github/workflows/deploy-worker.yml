name: Deploy worker (Trigger.dev)

# Deploys apps/worker (the daily indexer) to Trigger.dev when it, or code it bundles,
# changes on main; can also be run by hand. Skips cleanly until the repository has the
# TRIGGER_ACCESS_TOKEN secret (a Trigger.dev personal access token) and the
# TRIGGER_PROJECT_REF variable (proj_…), both under Settings → Secrets and variables → Actions.

on:
  push:
    branches: [main]
    paths:
      - "apps/worker/**"
      - "packages/indexer/**"
      - "packages/merkle/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
      TRIGGER_PROJECT_REF: ${{ vars.TRIGGER_PROJECT_REF }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -z "$TRIGGER_ACCESS_TOKEN" ] || [ -z "$TRIGGER_PROJECT_REF" ]; then
            echo "::notice::Skipping deploy: add the TRIGGER_ACCESS_TOKEN secret and the TRIGGER_PROJECT_REF variable to enable it."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'

      - name: Install pnpm
        if: steps.cfg.outputs.ready == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node
        if: steps.cfg.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.cfg.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Typecheck and test the worker
        if: steps.cfg.outputs.ready == 'true'
        run: pnpm --filter @mmr/worker typecheck && pnpm --filter @mmr/worker test

      - name: Deploy to Trigger.dev
        if: steps.cfg.outputs.ready == 'true'
        working-directory: apps/worker
        run: pnpm exec trigger deploy --skip-update-check
